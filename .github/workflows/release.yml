# Every build is tested and packaged. A version tag additionally publishes the
# installer and a portable folder that includes its own .NET/WPF runtime.
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
      ULTRAEXPLORER_TEST_WINDOW: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare pinned preview engines
        shell: pwsh
        run: |
          ./scripts/setup-preview-tools.ps1

      - name: Prepare pinned archive engine
        shell: pwsh
        run: ./scripts/setup-archive-tools.ps1

      # A tag v1.2.3 is version 1.2.3 (v1.2.3-beta.1 is 1.2.3-beta.1, file
      # version 1.2.3); any other build is 0.0.0-ci.<run number>.  The ref
      # comes in through the environment, never pasted into the script.
      - name: Work out the version
        id: version
        shell: pwsh
        env:
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:REF.StartsWith('refs/tags/v')) {
            $version = $env:REF.Substring('refs/tags/v'.Length)
          } else {
            $version = "0.0.0-ci.$env:RUN_NUMBER"
          }
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') {
            throw "A release tag looks like v1.2.3 or v1.2.3-beta.1, not '$env:REF'."
          }
          $fileVersion = ($version -split '-', 2)[0]
          if (($fileVersion -split '\.' | Where-Object { [long]$_ -gt 65535 }).Count -gt 0) {
            throw 'Each Windows file-version component must fit in 16 bits.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "file_version=$fileVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version (file version $fileVersion)"

      - name: Build the app and the checks
        shell: pwsh
        run: |
          foreach ($project in @(
            'src/UltraExplorer/UltraExplorer.csproj',
            'tests/ViewAllSmoke/ViewAllSmoke.csproj',
            'tests/NativeDialogProxySmoke/NativeDialogProxySmoke.csproj',
            'tests/FolderTagsSmoke/FolderTagsSmoke.csproj'
          )) {
            dotnet build $project -c Release -p:SelfContained=true -nologo
            if ($LASTEXITCODE -ne 0) { throw "$project failed with exit code $LASTEXITCODE." }
          }

      - name: Check colour Tags sidebar
        shell: pwsh
        run: |
          $env:ULTRAEXPLORER_STATE_DIR = Join-Path $env:RUNNER_TEMP 'UltraExplorer-tags-checks'
          & tests/FolderTagsSmoke/bin/Release/net10.0-windows/win-x64/FolderTagsSmoke.exe
          if ($LASTEXITCODE -ne 0) { throw "Folder Tags checks failed with exit code $LASTEXITCODE." }

      - name: Check universal document previews and Quick Look
        shell: pwsh
        run: |
          $env:ULTRAEXPLORER_STATE_DIR = Join-Path $env:RUNNER_TEMP 'UltraExplorer-preview-checks'
          & tests/ViewAllSmoke/bin/Release/net10.0-windows/win-x64/ViewAllSmoke.exe --only DocumentPreviewChecks,UniversalThumbnailChecks,QuickPreviewChecks,PreviewSpaceGestureChecks,SpacePreviewWindowChecks,ImmediatePanChecks,PreviewImageChecks,LightTextPreviewChecks
          if ($LASTEXITCODE -ne 0) { throw "Universal preview checks failed with exit code $LASTEXITCODE." }

      - name: Check manifest-safe local update and rollback
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/InstallPayloadChecks.ps1
          if ($LASTEXITCODE -ne 0) { throw "Installer payload checks failed with exit code $LASTEXITCODE." }

      - name: Check Quick Look interaction, app choices and compact media
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:ULTRAEXPLORER_STATE_DIR = Join-Path $env:RUNNER_TEMP 'UltraExplorer-preview-usability-checks'
          & tests/ViewAllSmoke/bin/Release/net10.0-windows/win-x64/ViewAllSmoke.exe --only PreviewOpenWithChecks,PreviewMediaUiChecks,PreviewOwnerActivationChecks,PreviewInteractionChecks
          if ($LASTEXITCODE -ne 0) { throw "Preview usability checks failed with exit code $LASTEXITCODE." }

      - name: Keep preview diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Preview-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/preview-usability/shots/*
          if-no-files-found: ignore
          retention-days: 3

      - name: Check optional features and PR4 corrections
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:ULTRAEXPLORER_STATE_DIR = Join-Path $env:RUNNER_TEMP 'UltraExplorer-optional-checks'
          $env:ULTRAEXPLORER_TEST_WINDOW = '1'
          & tests/ViewAllSmoke/bin/Release/net10.0-windows/win-x64/ViewAllSmoke.exe --only Pr4WorkspaceFixChecks,Pr4SearchFixChecks,Pr4ShelfSafetyChecks,Pr4ShelfDropChecks,OptionalFeatureChecks,ArchiveToggleChecks,ArchivePreviewChecks,ArchiveQuickLookWindowChecks,ArchiveLayoutChecks,ArchiveZoneChecks,OwnerClosePreviewChecks,MaskedPasswordChecks
          if ($LASTEXITCODE -ne 0) { throw "Optional feature checks failed with exit code $LASTEXITCODE." }

      - name: Check quiet updates and explicit installation
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:ULTRAEXPLORER_STATE_DIR = Join-Path $env:RUNNER_TEMP 'UltraExplorer-quiet-update-checks'
          & tests/ViewAllSmoke/bin/Release/net10.0-windows/win-x64/ViewAllSmoke.exe --only QuietUpdateChecks,QuietUpdateUiChecks
          if ($LASTEXITCODE -ne 0) { throw "Quiet update checks failed with exit code $LASTEXITCODE." }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/QuietUpdateApplyChecks.ps1
          if ($LASTEXITCODE -ne 0) { throw "Explicit update payload checks failed with exit code $LASTEXITCODE." }

      - name: Check file-dialog contracts
        shell: pwsh
        run: |
          $env:ULTRAEXPLORER_STATE_DIR = Join-Path $env:RUNNER_TEMP 'UltraExplorer-contract-checks'
          & tests/ViewAllSmoke/bin/Release/net10.0-windows/win-x64/ViewAllSmoke.exe --only PickerFilters,PickerCommandLine,PickerNames,PickerSessionRules,PickerValidation,PickerGraphRules,DialogIntegrationChecks
          if ($LASTEXITCODE -ne 0) { throw "File-dialog checks failed with exit code $LASTEXITCODE." }

      # Deterministic owned-state/primitive coverage. No foreground window,
      # real inaccessible share, Shell menu COM extension, default-app launch
      # or full timing-sensitive desktop suite is used by this subset.
      - name: Check runner-safe review integration
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:ULTRAEXPLORER_STATE_DIR = Join-Path $env:RUNNER_TEMP 'UltraExplorer-review2-checks'
          $env:TEMP = Join-Path $env:RUNNER_TEMP 'ue-r2-t'
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          & tests/ViewAllSmoke/bin/Release/net10.0-windows/win-x64/ViewAllSmoke.exe --only ReleasePackagingChecks,ReadLaneIntegrationChecks,ShellMenuReview2IntegrationChecks,NestedVisibilityRenameIntegrationChecks,FileCommandReview2Checks
          if ($LASTEXITCODE -ne 0) { throw "Review integration checks failed with exit code $LASTEXITCODE." }

      - name: Check selected-item focus and publication regressions
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:ULTRAEXPLORER_STATE_DIR = Join-Path $env:RUNNER_TEMP 'UltraExplorer-focus-checks'
          $env:TEMP = Join-Path $env:RUNNER_TEMP 'ue-focus-t'
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          & tests/ViewAllSmoke/bin/Release/net10.0-windows/win-x64/ViewAllSmoke.exe --only FocusSelectionChecks,BatchCommandLineChecks,PublicationLifecycleChecks,RefreshIdentityConsumerChecks
          if ($LASTEXITCODE -ne 0) { throw "Focus and publication regression checks failed with exit code $LASTEXITCODE." }

      - name: Publish with the .NET and WPF runtime beside the app
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FILE_VERSION: ${{ steps.version.outputs.file_version }}
        run: |
          dotnet publish src/UltraExplorer/UltraExplorer.csproj -c Release -r win-x64 -o publish `
            --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=true `
            -p:IncludeNativeLibrariesForSelfExtract=false -p:EnableCompressionInSingleFile=false `
            "-p:Version=$env:VERSION" "-p:FileVersion=$env:FILE_VERSION" -nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE." }
          foreach ($file in @('UltraExplorer.exe', 'UltraExplorer.dll', 'coreclr.dll', 'hostfxr.dll', 'PresentationNative_cor3.dll',
              'pdfium.dll', 'Magick.Native-Q8-x64.dll',
              'preview/f3d/bin/f3d.exe', 'preview/f3d/distribution.json',
              'preview/mpv/mpv.exe', 'preview/mpv/distribution.json', 'preview/mpv/licenses/LICENSE.GPL',
              'preview/licenses/pdfium/licenses/pdfium.txt', 'preview/licenses/magick-net/Notice.txt',
              'archives/7z.dll', 'archives/7z.exe', 'archives/License.txt', 'archives/readme.txt',
              'updater/ApplyDownloadedUpdate.ps1', 'updater/InstallPayload.ps1')) {
            if (-not (Test-Path -LiteralPath (Join-Path 'publish' $file) -PathType Leaf)) {
              throw "Self-contained publish is missing $file."
            }
          }
          if (Test-Path -LiteralPath 'publish/preview/zed') { throw 'The lightweight preview package must not contain a full Zed runtime.' }

      # The packages carry no version in their names, so a link to
      # releases/latest/download/<name> always gets the newest one.
      - name: Pack and verify the portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packages | Out-Null
          Copy-Item LICENSE, README.md, THIRD-PARTY-NOTICES.md publish/
          $publishRoot = (Resolve-Path 'publish').Path
          $relativeFiles = @(Get-ChildItem -LiteralPath $publishRoot -Recurse -File -Force |
            ForEach-Object { [IO.Path]::GetRelativePath($publishRoot, $_.FullName) })
          $relativeFiles += 'UltraExplorer-package-files.txt'
          $relativeFiles | Sort-Object -Unique | Set-Content -LiteralPath 'publish/UltraExplorer-package-files.txt' -Encoding utf8BOM
          Compress-Archive -Path publish/* -DestinationPath packages/UltraExplorer-win-x64.zip
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path 'packages/UltraExplorer-win-x64.zip').Path)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName.Replace('/', '\').TrimEnd('\') })
            $missing = @($relativeFiles | Where-Object { $_ -notin $entries })
            if ($missing.Count) { throw "Portable archive is missing: $($missing -join ', ')" }
            Write-Host "Portable archive verified: $($relativeFiles.Count) files."
          } finally {
            $zip.Dispose()
          }

      # Use the same compiler on every runner; the NuGet tool package contains
      # the original signed Inno Setup binaries and requires no installation.
      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FILE_VERSION: ${{ steps.version.outputs.file_version }}
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'UltraExplorer-InnoSetup-6.4.3'
          $toolZip = "$toolRoot.zip"
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/tools.innosetup/6.4.3/tools.innosetup.6.4.3.nupkg' -OutFile $toolZip
          $expectedHash = '9D67A2B1155CA5BC825475CEB907AA357C5FEB42E474CFD5347EDDEEF5AD92A5'
          if ((Get-FileHash -LiteralPath $toolZip -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'The pinned Inno Setup package checksum did not match.'
          }
          Expand-Archive -LiteralPath $toolZip -DestinationPath $toolRoot -Force
          $iscc = Join-Path $toolRoot 'tools/ISCC.exe'
          if ((Get-AuthenticodeSignature -LiteralPath $iscc).Status -ne 'Valid') {
            throw 'The Inno Setup compiler signature did not validate.'
          }
          Write-Host "Using $iscc"
          & $iscc "/DAppVersion=$env:VERSION" "/DAppFileVersion=$env:FILE_VERSION" `
            "/DPublishDir=..\publish" "/DOutputDir=..\packages" installer\UltraExplorer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE." }

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem packages/* -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -LiteralPath packages/SHA256SUMS.txt -Encoding utf8NoBOM
          Get-Content packages/SHA256SUMS.txt

      - name: Keep the packages
        uses: actions/upload-artifact@v4
        with:
          name: UltraExplorer-${{ steps.version.outputs.version }}-win-x64
          path: packages/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: UltraExplorer-${{ needs.build.outputs.version }}-win-x64
          path: packages

      - name: Check planned release notes
        if: github.ref_name == 'v1.3.0-beta.3' || github.ref_name == 'v1.3.0-beta.2' || github.ref_name == 'v1.3.0-beta.1' || github.ref_name == 'v1.2.1' || github.ref_name == 'v1.2.0' || github.ref_name == 'v1.2.0-beta.1'
        env:
          NOTES_PATH: ${{ github.ref_name == 'v1.3.0-beta.3' && 'docs/RELEASE_NOTES_v1.3.0-beta.3.md' || github.ref_name == 'v1.3.0-beta.2' && 'docs/RELEASE_NOTES_v1.3.0-beta.2.md' || github.ref_name == 'v1.3.0-beta.1' && 'docs/RELEASE_NOTES_v1.3.0-beta.1.md' || github.ref_name == 'v1.2.1' && 'docs/RELEASE_NOTES_v1.2.1.md' || github.ref_name == 'v1.2.0' && 'docs/RELEASE_NOTES_v1.2.0.md' || 'docs/RELEASE_NOTES_v1.2.0-beta.1.md' }}
        run: test -s "$NOTES_PATH"

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.build.outputs.prerelease == 'false' }}
          # action-gh-release reads body_path first; body is only a fallback
          # for other tags. The planned tag notes must exist before this step.
          body_path: ${{ github.ref_name == 'v1.3.0-beta.3' && 'docs/RELEASE_NOTES_v1.3.0-beta.3.md' || github.ref_name == 'v1.3.0-beta.2' && 'docs/RELEASE_NOTES_v1.3.0-beta.2.md' || github.ref_name == 'v1.3.0-beta.1' && 'docs/RELEASE_NOTES_v1.3.0-beta.1.md' || github.ref_name == 'v1.2.1' && 'docs/RELEASE_NOTES_v1.2.1.md' || github.ref_name == 'v1.2.0' && 'docs/RELEASE_NOTES_v1.2.0.md' || github.ref_name == 'v1.2.0-beta.1' && 'docs/RELEASE_NOTES_v1.2.0-beta.1.md' || '' }}
          body: |
            ## Download

            - **UltraExplorer-Setup-x64.exe**: install for your user, with Start menu shortcut and uninstaller.
            - **UltraExplorer-win-x64.zip**: extract the entire folder, then run UltraExplorer.exe.
            - **SHA256SUMS.txt**: checksums for both downloads.

            Both packages include the .NET and WPF runtime. No separate .NET installation is required.
            Your settings, notes and colour tags are kept in your local profile when updating.
